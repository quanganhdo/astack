name: AStack checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: astack-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bash tools/check.sh

  pi:
    name: Pi 1.3.0 API and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install test dependencies
        run: bun install --frozen-lockfile
      - name: Install supported Pi into a disposable directory
        run: npm install --prefix "$RUNNER_TEMP/astack-pi" --ignore-scripts @earendil-works/pi-coding-agent@1.3.0
      - name: Typecheck the extension against Pi
        run: bun tools/typecheck-pi.mjs
        env:
          PI_PACKAGE_DIR: ${{ runner.temp }}/astack-pi/node_modules/@earendil-works/pi-coding-agent
      - name: Verify model catalog and installed startup without model requests
        run: bun test tests/pi/catalog.test.mjs tests/pi/runtime.test.mjs
        env:
          PI_PACKAGE_DIR: ${{ runner.temp }}/astack-pi/node_modules/@earendil-works/pi-coding-agent
          ASTACK_PI_REQUIRE_RUNTIME: "1"
          ASTACK_PI_REQUIRE_CATALOG: "1"
